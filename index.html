<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bando 3D Globe</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cesium@1.125/Build/Cesium/Widgets/widgets.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="cesiumContainer" aria-label="3D world map"></div>

    <div class="control-panel" role="region" aria-label="Fly to sample locations">
      <h1>Bản đồ thế giới 3D</h1>
      <p>Chọn địa điểm để bay tới:</p>
      <div class="buttons" id="flyToButtons"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/cesium@1.125/Build/Cesium/Cesium.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
